    <form [formGroup]="contactForm" (ngSubmit)="sendMessage()">
      <div>
        <label for="email">Email cím</label>
        <input type="email" id="email" formControlName="email" placeholder="name@example.com">
      </div>
      <div>
        <label for="message">Üzenet</label>
        <textarea id="message" formControlName="message" rows="6" placeholder="Írd meg az üzeneted..."></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Küldés</button>
    </form>
