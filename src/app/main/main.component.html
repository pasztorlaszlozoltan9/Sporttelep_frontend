<h2> Sportágak</h2>
<div>
  <table>
    <thead>
@for(sport of sportList; track sport.id){
  <th><div class="card">
      <div class="card-header">
    {{sport.name}}
  </div>
  </div>
  </th>
}
    </thead>
    <tbody>
      @for(loc of locList; track loc.id){
        <tr><div class="card">
  <div class="card-header">{{loc.name}}, {{loc.address}}, {{loc.email}}</div>
        </div></tr>
      }
      <tr>
       <td>Pálya 1</td>
       <td>Pálya 2</td>
       <td>Pálya 3</td>
      </tr>
    </tbody>
  </table>

</div>
