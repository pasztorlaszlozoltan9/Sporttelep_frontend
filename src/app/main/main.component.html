<head>
  <meta charset="utf-8">
  <title>Budapest Sporttelepek</title>

</head>

<h2> Sportágak</h2>
<div class="main-container">

  <div class="sports-row">
    <button class="chip" *ngFor="let sport of sportList" (click)="selectSport(sport)"
      [class.active]="selectedSportId === sport.id">
      {{ sport.name }}
    </button>
  </div>

  <div *ngIf="selectedSportId" class="locations-section">
    <h3>Helyszínek</h3>
    <div class="locations-row">
      <button class="chip" *ngFor="let loc of filteredLocations" (click)="selectLocation(loc)"
        [class.active]="selectedLocationId === loc.id">
        {{ loc.name }}
      </button>
    </div>
  </div>
 


  <div *ngIf="selectedLocationId" class="fields-section">
    <h3>Pályák</h3>
    <div class="fields-row">
      <button class="chip" *ngFor="let field of filteredFields" (click)="selectField(field)"
        [class.active]="selectedFieldId === field.id">
        {{ field.name }}
      </button>
    </div>
  </div>

    <div *ngIf="selectedFieldId" class="price-section">
    <h4>Ár: <span class="price-value">{{ selectedPrice || 'N/A' }} Ft</span></h4>
  </div>

  <div *ngIf="selectedFieldId" class="dates-section">
    <h4>Elérhető dátumok</h4>
    <div class="dates-row">
      <button class="chip" *ngFor="let d of availableDates" (click)="selectDate(d)" [class.active]="selectedDate === d">
        {{ d }}
      </button>
    </div>
    <div *ngIf="availableDates.length === 0" class="text-muted mt-1">
      Nincs szabad időpont ehhez a pályához.
    </div>
  </div>

  <div *ngIf="selectedDate" class="times-section">
    <h4>Elérhető időpontok ({{ selectedDate }})</h4>
    <div class="times-row">
      <button class="chip" *ngFor="let slot of timesForSelectedDate" (click)="selectSlot(slot)"
        [class.active]="selectedSlot === slot">
        {{ slot.startTime || slot.time || '—' }}
      </button>
    </div>
  </div>




  <div class="actions">
    <button (click)="goToBooking()" class="btn btn-primary" [class.disabled]="!selectedSlot">
      Foglalás
    </button>
  </div>
</div>
