<head>
  <meta charset="utf-8">
  <title>Profil</title>

</head>

<div class="profil-container">
  <h2>Profil</h2>

  <div class="user-info" *ngIf="user">
    <table class="info-table">
        <thead>
        <tr>
          <th><label class="form-label">Felhasználónév</label></th>
          <th><label class="form-label">Email</label></th>
          <th><label class="form-label">Telefonszám</label></th>
          <th><label class="form-label">Teljes Név</label></th>
          <th><label class="form-label">Műveletek</label></th>
 
      </thead>
      <tr>
        <td>
          <input type="text" class="form-control" [value]="user.name" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="user.email" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="user.phone" readonly>
        </td>
        <td>

          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly>
        </td>
        <td>
          <div class="actions">
            <button class="btn btn-warning btn-sm" type="button">Módosítás</button>
            <button class="btn btn-danger btn-sm" type="button">Profil törlése</button>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <h2>Foglalások</h2>

  <div class="bookings-info" *ngIf="user">
    <table class="bookings-table">
      <thead>
        <tr>
          <th><label class="form-label">Sport</label></th>
          <th><label class="form-label">Helyszín</label></th>
          <th><label class="form-label">Pálya</label></th>
          <th><label class="form-label">Ár</label></th>
          <th><label class="form-label">Dátum</label></th>
          <th><label class="form-label">Kezdési idő</label></th>
          <th><label class="form-label">Műveletek</label></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
          <input type="text" class="form-control" [value]="user.fullname || 'N/A'" readonly></td>
          <td>
            <div class="actions">
              <button class="btn btn-warning btn-sm" type="button">Módosítás</button>
              <button class="btn btn-danger btn-sm" type="button">Törlés</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="logout-section">
    <form (submit)="onSubmit()">
      <button class="btn btn-primary" type="submit">Kijelentkezés</button>
    </form>
  </div>
</div>
