<head>
  <meta charset="utf-8">
  <title>Foglalás</title>

</head>

<div class="booking-container">
  <h2>Foglalási adatok</h2>

  <div class="booking-info" *ngIf="sportId && locationId && fieldId && date && startTime">
    <table class="info-table">
     <thead>
        <tr>
          <th><label class="form-label">Sport</label></th>
          <th><label class="form-label">Helyszín</label></th>
          <th><label class="form-label">Pálya</label></th>
          <th><label class="form-label">Foglaló email cím</label></th>
          <th><label class="form-label">Dátum</label></th>
          <th><label class="form-label">Kezdési idő</label></th>
          <th><label class="form-label">Ár</label></th>
        </tr>
      </thead>
      <tbody>
      <tr>
        <td>
          <input type="text" class="form-control" [value]="sportName || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="locationName || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="fieldName || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="userEmail || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="date || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="startTime || 'N/A'" readonly>
        </td>
        <td>
          <input type="text" class="form-control" [value]="price || 'N/A'" readonly>
        </td>
      </tr>
        </tbody>   
    </table>
  </div>

  <div class="booking-form" *ngIf="sportId && locationId && fieldId && date && startTime">
    <form (submit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Megjegyzés</label>
        <textarea class="form-control" placeholder="Opcionális megjegyzés" rows="4" [(ngModel)]="bookingNote" name="bookingNote"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Tovább fizetéshez</button>
        <button class="btn btn-secondary" type="button" (click)="goBack()">Vissza</button>
      </div>
    </form>
  </div>

  <div *ngIf="!sportId || !locationId || !fieldId || !date || !startTime" class="hint">
    <p>Nincs kiválasztott foglalási adat. Kérjük válassz egy foglalást az főoldalon.</p>
  </div>
</div>
